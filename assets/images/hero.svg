<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img"
     aria-label="The ElectroDonut robot on a circuit board">
  <defs>
    <radialGradient id="h-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3D7F" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF3D7F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-head" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF5C93"/>
      <stop offset="1" stop-color="#F02268"/>
    </linearGradient>
    <linearGradient id="h-dough" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F0C08A"/>
      <stop offset="1" stop-color="#DDA062"/>
    </linearGradient>
    <!-- The bite, as a real transparent notch. -->
    <mask id="h-bite">
      <rect width="520" height="440" fill="#fff"/>
      <circle cx="218" cy="275" r="24" fill="#000"/>
    </mask>
  </defs>

  <circle cx="270" cy="205" r="200" fill="url(#h-glow)"/>
  <circle cx="105" cy="95"  r="115" fill="url(#h-glow2)"/>

  <!-- circuit board underneath -->
  <g stroke="#22D3EE" stroke-width="2.5" fill="none" opacity="0.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 118h70l34 34h56"/>
    <path d="M20 202h56l30-30"/>
    <path d="M40 302h60l40 40h66"/>
    <path d="M500 128h-70l-34 34"/>
    <path d="M492 218h-60l-30 30"/>
    <path d="M472 320h-60l-40-40"/>
    <path d="M150 28v40l30 30"/>
    <path d="M372 24v46l-30 30"/>
    <path d="M182 412v-40l40-40"/>
    <path d="M342 416v-50l-30-30"/>
  </g>
  <g fill="#22D3EE" opacity="0.85">
    <circle cx="30" cy="118" r="4.5"/><circle cx="20" cy="202" r="4.5"/>
    <circle cx="40" cy="302" r="4.5"/><circle cx="500" cy="128" r="4.5"/>
    <circle cx="492" cy="218" r="4.5"/><circle cx="472" cy="320" r="4.5"/>
    <circle cx="150" cy="28" r="4.5"/><circle cx="372" cy="24" r="4.5"/>
    <circle cx="182" cy="412" r="4.5"/><circle cx="342" cy="416" r="4.5"/>
  </g>

  <!-- a couple of surface-mount parts for texture -->
  <!-- Outlined rather than solid dark, so they still read against a
       near-black page background. -->
  <g opacity="0.85">
    <rect x="54" y="146" width="46" height="30" rx="6" fill="#111826"
          stroke="#22D3EE" stroke-width="2" stroke-opacity="0.55"/>
    <rect x="62" y="154" width="26" height="4" rx="2" fill="#22D3EE"/>
    <rect x="62" y="163" width="18" height="4" rx="2" fill="#22D3EE"/>
    <rect x="424" y="262" width="46" height="30" rx="6" fill="#111826"
          stroke="#22D3EE" stroke-width="2" stroke-opacity="0.55"/>
    <rect x="432" y="270" width="26" height="4" rx="2" fill="#22D3EE"/>
    <rect x="432" y="279" width="18" height="4" rx="2" fill="#22D3EE"/>
  </g>

  <!-- ==================== the robot ==================== -->
  <!-- antenna -->
  <circle cx="260" cy="77" r="16" fill="#22D3EE"/>
  <rect x="253.8" y="88" width="12.4" height="34" rx="6.2" fill="#F02268"/>

  <!-- ears -->
  <rect x="116" y="171" width="29" height="68" rx="14.5" fill="#F02268"/>
  <rect x="374" y="171" width="29" height="68" rx="14.5" fill="#F02268"/>

  <!-- head -->
  <rect x="140" y="119" width="239" height="167" rx="39" fill="url(#h-head)"/>

  <!-- a faint trace etched into the face, so it reads as hardware -->
  <g stroke="#fff" stroke-width="2.5" fill="none" opacity="0.22"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 262h34l18-18h30"/>
    <path d="M360 150h-28l-16 16"/>
  </g>

  <!-- eyes -->
  <rect x="179" y="158" width="62" height="57" rx="18" fill="#fff"/>
  <rect x="278" y="158" width="62" height="57" rx="18" fill="#fff"/>

  <!-- smile -->
  <path d="M280 238c15.6 18.7 43.7 18.7 59.3 0" fill="none" stroke="#fff"
        stroke-width="12.5" stroke-linecap="round"/>

  <!-- donut -->
  <path mask="url(#h-bite)" fill="url(#h-dough)" fill-rule="evenodd"
        d="M181 254a54.6 54.6 0 1 0 0 109.2 54.6 54.6 0 1 0 0-109.2Zm0 33.8a20.8 20.8 0 1 1 0 41.6 20.8 20.8 0 1 1 0-41.6Z"/>

  <!-- sprinkles -->
  <g fill="#fff">
    <rect x="141.6" y="270.6" width="9.4" height="23.9" rx="4.7" transform="rotate(30 146.3 282.6)"/>
    <rect x="167.6" y="338.2" width="9.4" height="23.9" rx="4.7" transform="rotate(8 172.3 350.2)"/>
    <rect x="152" y="249.4" width="9.4" height="23.9" rx="4.7" transform="rotate(-52 156.7 261.4)"/>
  </g>
  <g fill="#22D3EE">
    <rect x="133.2" y="315.6" width="9.4" height="23.9" rx="4.7" transform="rotate(-35 137.9 327.6)"/>
    <rect x="200.8" y="320.8" width="9.4" height="23.9" rx="4.7" transform="rotate(55 205.5 332.8)"/>
  </g>
</svg>
